<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TaskFlow - Modern To-Do App</title>
    <link rel="stylesheet" href="style.css">

    <!-- EmailJS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script>
        (function(){
            emailjs.init("B9lYO6Ehj8bRuAJn4"); // Your Public Key
        })();
    </script>
</head>
<body>

    <header class="app-header">
        <h1>ToDo ToDo ToDoToDoToDo List</h1>
        <p>Stay organized. Stay productive.</p>
    </header>

    <div class="container">
        <div class="input-section">
            <input type="text" id="taskInput" placeholder="What needs to be done?">
            <button id="addTaskBtn">+ Add Task</button>
        </div>

        <ul id="taskList"></ul>

        <div class="task-stats">
            <div class="stat">
                <span id="totalTasks">0</span>
                <small>Total</small>
            </div>
            <div class="stat">
                <span id="completedTasks">0</span>
                <small>Completed</small>
            </div>
            <div class="stat">
                <span id="pendingTasks">0</span>
                <small>Pending</small>
            </div>
            <div class="input-section">
                <div class="email-section">
                    <label>Your Email</label>
                    <input type="email" id="userEmail" placeholder="Enter your email">
                </div>

                <div class="task-row">
                    <input type="text" id="taskInput" placeholder="What needs to be done?">
                    <button id="addTaskBtn">+ Add Task</button>
                </div>
            </div>
            <button id="exportBtn">Export Tasks</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
